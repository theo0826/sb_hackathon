name: Validate static site

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_AI_DESIGN_URL: ${{ vars.NEXT_PUBLIC_AI_DESIGN_URL }}
      NEXT_PUBLIC_AI_QUOTE_URL: ${{ vars.NEXT_PUBLIC_AI_QUOTE_URL }}
      NEXT_PUBLIC_CLOTH_WORKER_URL: ${{ vars.NEXT_PUBLIC_CLOTH_WORKER_URL || 'https://clothsim-api.set35230.workers.dev' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        with:
          name: static-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
