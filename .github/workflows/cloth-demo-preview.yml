name: Deploy cloth demo branch to GitHub Pages

on:
  push:
    branches: [codex/clothdata-demo-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  preview:
    if: github.ref == 'refs/heads/codex/clothdata-demo-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_CLOTH_WORKER_URL: https://clothsim-api.set35230.workers.dev
      - run: npm run test:pages
      - uses: actions/upload-artifact@v4
        with:
          name: cloth-demo-static-preview
          path: out/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out/

  deploy:
    if: github.ref == 'refs/heads/codex/clothdata-demo-integration'
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
